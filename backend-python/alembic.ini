# backend-python/alembic.ini
# SCHOLARIS database migration configuration.
# Run from backend-python/:  alembic upgrade head   (see docs/MIGRATIONS.md)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is supplied by alembic/env.py from the DATABASE_URL environment
# variable (same variable the application uses). Never put credentials here.

# File name template for new revision files.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
