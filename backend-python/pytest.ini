[pytest]
testpaths = tests
# Third-party libraries emit deprecation warnings for APIs that are still the
# supported path in the pinned versions (pydantic v2 shims, Starlette internals).
# Failures and assertion errors are unaffected.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*PydanticDeprecatedSince20.*
